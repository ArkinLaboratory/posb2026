  used_in: ["s11"]
  provenance: "cropped from page 23 of private/readings/Session 11 - potvin-trottier-2016-synchronous-long-term-oscillations.pdf (the PMC author manuscript, NIHMS816655) at 220 dpi, box (0.295,0.255)-(0.560,0.380) in page fractions. Figure numbering in the author manuscript matches the published Nature version; the figures sit on pp. 23, 25, 27."
