    The lines are PREDICTIONS from Eq. 6, not regressions through these
    points -- legend, p. 1101: "The lines are predictions by Eq. 6, using the
    growth rate lambda(phi_U = 0) and intercept phi_c = 0.48 computed from
    the average r_max (table S4)."
    But do NOT say "nothing was taken from this data". Each line is anchored
    at that medium's own zero-induction growth rate; what was fixed in
    advance is the SLOPE, via an r_max fitted to a different experiment.
    The paper's own phrase is "without any adjustable parameters" (p. 1102),
    which is about the prediction, not about the anchoring.

scott2010_fig4c:
  figure: "Fig. 4C"
  shows: "growth rate against unnecessary protein as a percentage of total, for beta-galactosidase, beta-lactamase and a truncated EF-Tu from different promoters on different plasmids -- scatter only, no lines"
  used_in: ["s19"]
