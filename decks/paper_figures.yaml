    NO LINES AND NO MEDIA SERIES in this panel -- an earlier version of the
    s19 slide carried a caption that described 4B and claimed it of both.
    Checked against the rendered figure, 25 Oct.
    The claim this panel supports is the one about SUBSTITUTABILITY:
    THREE proteins across FOUR expression systems -- beta-galactosidase
    appears twice, from different promoters in different papers, and that
    pair is its own control. Different proteins, different plasmids,
    different laboratories, and the growth defect does not care which one
    it is. That is the strongest evidence for charging by proteome fraction
    alone. (An earlier version of this note and of the slide said "four
    unrelated proteins". Wrong on both counts.)

