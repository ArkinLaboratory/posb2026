# SESSION 18 -- Protein circuits
# ============================================================================
#
# Cropping convention, settled 25 Oct 2026 while cutting these: crop the PLOT
# ONLY and let the deck carry the attribution. A journal caption is set at
# 7-8 pt; projected at the back of a lecture hall it is unreadable, and the
# three captions here run 3, 10 and 9 lines. An equation crop is the exception,
# because there the text is the content.

# --- Goldbeter & Koshland, PNAS 78(11):6840-6844 (1981) ---------------------
# "An amplified sensitivity arising from covalent modification in biological
# systems"   doi:10.1073/pnas.78.11.6840
#
# The printed Eq. 7 carries a typo: the leading bracket reads (V2/V2 - 1)
# where (V1/V2 - 1) is required. Confirmed two ways -- by rendering p. 6841 at
# 200 dpi and reading it, and by deriving the quadratic independently from
# Eq. 8. Say so when the equation goes up; a published typo found by doing the
# algebra is a better argument for doing the algebra than anything we can say.

gk1981_eq7:
  figure: "Eq. 7"
  shows: "the closed-form steady-state solution for W*, as printed"
  used_in: ["s18"]
  note: "Carries the V2/V2 typo. Put it up and let the room find it."

gk1981_eq7_eq8:
  figure: "Eq. 7 and Eq. 8"
  shows: "the closed form and its rearrangement to V1/V2 = W*(1 - W* + K1) / [(1 - W*)(W* + K2)]"
  used_in: ["s18"]
  note: "Eq. 8 is the form segment 2 derives. Deriving it ourselves and then showing this is the check."

gk1981_fig1:
  figure: "Fig. 1"
  shows: "W and W* against V1/V2 on log axes, for K1 = K2 = 1.0 and K1 = K2 = 1e-2; the two pairs cross at 0.5"
  used_in: ["s18"]
  note: "The paper's own version of figures/build/s18_response.png. Show theirs, then ours, then have them reproduce it in the notebook. Nothing in the sharp curve is cooperative -- there is one modification site and no binding between sites anywhere in the model."

gk1981_fig2:
  figure: "Fig. 2"
  shows: "R_s and R_v on one log axis: R_s against Hill coefficient (dashed), R_v against K2 for K1 = 10 K2, K1 = K2 and K1 = 0.1 K2 (solid)"
  used_in: ["s18"]
  note: "The conversion between the two currencies, drawn by the authors. Two anchors to read off with the room: R = 3 at n_H = 4 (81^(1/4) = 3.00), and the paper's own R_s = 4.5 at n_H = 2.9, which it attributes to hemoglobin. Then note the n_H axis stops at 12 -- which is why the prose says a cycle at K = 1e-2 is 'greater than 13' while the paper's own Eq. 10 gives 26.08. The figure ran out of axis. [the reading-off explanation is our inference, not the paper's statement]"

gk1981_fig3:
  figure: "Fig. 3"
  shows: "the same response when enzyme is NOT negligible: E_1T = E_2T much less than W_T, = 0.1 W_T, and = W_T, at K1 = K2 = 1e-1"
  used_in: ["s18"]
  note: "The assumption, violated, by the authors themselves. At E_T = W_T the swing collapses to roughly 0.12-0.27 and the switch is gone -- substrate sequestered in complex is substrate that cannot move. This is the honest caveat on the notebook model, and it is the same mechanism as s19's competition and s21's retroactivity: a molecule held by something that is not its target."

gk1981_eq10_eq11:
  figure: "Eq. 10 and Eq. 11"
  shows: "R_v = 81(K1 + 0.1)(K2 + 0.1) / [(K1 + 0.9)(K2 + 0.9)], and S_0.9/S_0.1 = R_s = 81^(1/n_H)"
  used_in: ["s18"]
  note: "These two are what posb.protein.sensitivity_index and apparent_hill implement. Show them beside the code. Fig. 2's caption attributes its curves to Eq. 12, the form with nonproductive binding, which reduces to Eq. 10 at rho = 0 [the paper does not state which rho Fig. 2 uses -- unverified]."

# --- Dueber, Mirsky & Lim, Nat Biotechnol 25(6):660-662 (2007) -------------
# "Engineering synthetic signaling proteins with ultrasensitive input/output
# control"   doi:10.1038/nbt1308
dueber2007_fig1b:
  figure: "Fig. 1b"
  shows: "one sigmoid with its four parameters named: basal activity, induced activity, K_act, and ultrasensitivity (n_H)"
  used_in: ["s18"]
  note: "Open the session on this. It is the frame for everything that follows -- our u_50 is their K_act and our apparent n is their n_H -- and it comes from a paper rather than from us. It also puts 'kinase, phosphatase' in front of the room in the authors' words, which no deck from s04 to s17 has done."

dueber2007_fig1a:
  figure: "Fig. 1a"
  shows: "unregulated node, to primitive node with a linear response, to complex node with multiple autoinhibitory domains and a sigmoidal response"
  used_in: ["s18"]
  note: "A second route to the same sharpness, through autoinhibition rather than saturation. Worth one surface so the room does not leave thinking zero-order is the only way."

# --- Bashor, Helman, Yan & Lim, Science 319:1539-1543 (2008) ---------------
# "Using engineered scaffold interactions to reshape MAP kinase pathway
# signaling dynamics"   doi:10.1126/science.1151153
#
# AUTHOR CHECK: Helman and Yan. An earlier draft of the week-10 plan gave the
# authors as "Bashor, Horwitz, Peisajovich, Lim" -- two of those names were
# invented. Corrected against the PDF.
# ERRATUM, 22 August 2008, printed on the last two pages of the PDF: Science
# reissued the circuit diagrams of Fig. 4 panels B and D. The versions printed
# in the article are superseded. So bashor2008_fig4 below -- cropped from the
# article page -- carries the UNCORRECTED B and D schematics, and the corrected
# ones are separate keys. Use the full figure for the four-behaviors argument,
# where the panel that matters is the time course; use the corrected key
# wherever panel D's wiring is the thing being read.
bashor2008_fig4:
  figure: "Fig. 4"
  shows: "four behaviors from one recruitment toolkit -- pulse generator, accelerator, delay, ultrasensitive switch -- each as a circuit diagram beside its measured time course"
  used_in: ["s18"]
  note: "The 'a parameter is manufactured' thesis in its strongest measured form: same parts, four dynamics, chosen by where the modulator is recruited and with what affinity. The B and D SCHEMATICS here are the superseded ones -- see the erratum keys below."

bashor2008_fig4b_corrected:
  figure: "Fig. 4B, erratum of 22 August 2008"
  shows: "the corrected accelerator circuit: constitutive positive modulator, then inducible expression of the negative modulator"
  used_in: ["s18"]

bashor2008_fig4d_corrected:
  figure: "Fig. 4D, erratum of 22 August 2008"
  shows: "the corrected ultrasensitive-switch circuit: constitutive negative modulator, then inducible expression of a HIGH-AFFINITY positive modulator that displaces it"
  used_in: ["s18"]
  note: "Science states exactly what was wrong, on PDF p. 6 -- the erratum is pp. 6-7, not the last two pages. In 4D the positive modulator's leucine zipper should have been BLACK, because it binds more tightly than the negative modulator's (K_d 6.1 versus 41 nM), and the label should have read high-affinity. In 4B both zippers should have been GRAY, because there both modulators carried identical zippers and the printed label wrongly said high affinity. The erratum also amends two sentences of main text, the Fig. 4 legend, fig. S3 and tables S1-S2. Five months after publication, not four. Teaching value: the uncorrected 4D contradicts the mechanism it illustrates, since displacement requires the affinity difference."

bashor2008_fig4d:
  figure: "Fig. 4D"
  shows: "dose-response to alpha-factor for the enhanced ultrasensitive switch against wild type"
  used_in: ["s18"]
  note: "The only MEASURED Hill coefficients in this session: WT 1.21 +/- 0.06, simple positive-feedback loop 2.42, full circuit 2.84 +/- 0.19. These are a different KIND of number from our computed 26.08 and must be labelled as such on the slide. The ladder worth drawing: engineered switch 2.84 (measured), hemoglobin 2.9 (measured, via Goldbeter & Koshland), zero-order cycle at k = 0.01 -> 26.1 (derived by us). The mechanism with no cooperative binding in it wins by an order of magnitude, on paper."

# --- Qi, Larson, Gilbert, Doudna, Weissman, Arkin & Lim, ---------------------
# Cell 152(5):1173-1183 (2013)   doi:10.1016/j.cell.2013.02.022
qi2013_fig1a:
  figure: "Fig. 1A"
  shows: "the sgRNA chimera: 20 nt base-pairing region, 42 nt dCas9 handle, 40 nt S. pyogenes terminator"
  used_in: ["s18"]
  note: "Specificity is 20 nt of Watson-Crick pairing you type out, against a repressor's protein-DNA interface that took evolution to make and that s17 showed we cannot reliably recombine. That contrast is the reason this medium is on the list."

qi2013_fig1b:
  figure: "Fig. 1B"
  shows: "wt Cas9 binds and cleaves; dCas9 binds and blocks RNA polymerase instead"
  used_in: ["s18"]
  note: "Two amino acid substitutions turn a nuclease into a roadblock. Mechanism before model -- the repression model (T46) only makes sense once the room has seen that the block is steric."

# --- Mishra, Bepler, Teague, Berger, Broach & Weiss, -----------------------
# Science 373(6550):eaav0780 (2021)   doi:10.1126/science.aav0780
# REQUIRED READING for s18. NOTE: a different Mishra from the s21 load-driver
# paper (Mishra et al. 2014). Do not merge the two in readings.yaml.
#
# AUTHOR CHECK: read off page 1 of the PDF, 25 Oct. The first draft of this
# block invented eight names. That is the second fabricated author list in
# this session's material -- see the Bashor note above. Author lists get read
# off the page, never recalled.
mishra2021_fig3a:
  figure: "Fig. 3A"
  shows: "the engineered toggle's two arms as a wiring diagram"
  used_in: ["s18"]

mishra2021_fig3b:
  figure: "Fig. 3B"
  shows: "the full molecular pathway in membrane, cytosol and nucleus -- SLN1/SHO1 branches, YPD1, SSK1, SSK2, PBS2, HOG1, HOT1, and the chimeric fusions CRE1-HKRR, STAT5-HKRR, GFP-HOG1-PTP, HOT1-JH1, in a quintuple-deletion background"
  used_in: ["s18"]
  note: "The object before the model, as a real pathway with real protein names. Spend time here. Every arrow is a phosphotransfer, the deleted genes are listed on the figure, and the two chimeras are the part of it that is engineered rather than found."

mishra2021_fig3c:
  figure: "Fig. 3C"
  shows: "the construct's measured steady states"
  used_in: ["s18"]

mishra2021_fig4a:
  figure: "Fig. 4A"
  shows: "mean nuclear intensity after a 30-s sorbitol pulse (up) and a 30-s IP pulse (down), n = 100 cells"
  used_in: ["s18"]
  note: "Two numbers to say out loud: the transition completes in about one minute, and the input lasted 30 seconds and the state stayed. Gardner's toggle needed hours and a 6-h induction. Same topology, same phase plane, timescale faster by orders of magnitude -- which is the answer to the question s02 asked the room on 1 September."

mishra2021_fig4c:
  figure: "Fig. 4C"
  shows: "single-cell trajectories at five sorbitol doses, for the defective toggle (triple deletion) above and the full toggle network below, after a 2-s pulse"
  used_in: ["s18"]
  note: "The control that earns the claim. The defective toggle never latches -- at 1e6 uM it rises and decays back. The full network latches at 100 uM and holds flat for the rest of the trace. Two seconds of input, a permanent state change: the two attractors of s08's phase plane, seen in single cells."

mishra2021_fig4d:
  figure: "Fig. 4D"
  shows: "flux and percentage of cells flipped against input concentration, over 1e-2 to 1e6 uM"
  used_in: ["s18"]
  note: "The dose-response, for the threshold half of the argument. Pair with the reachable-threshold band from figures/build/."

# Added 25 Oct after rendering the deck and measuring what reached the page.
# gk1981_eq7_eq8 was a single column crop that landed 2.8in wide on a 13.3in
# slide; Eq. 7 is set across BOTH columns of the printed page, so cropping it
# as a column both cut it and shrank it. bashor2008_fig4 is four panels in a
# journal column and renders 3.0in wide, which is not readable from the back
# of a lecture hall. Both are kept -- they are correct crops -- but the deck
# now uses these.
gk1981_eq7_wide:
  figure: "Eq. 7"
  shows: "the full-width closed form for W*, with the [7] tag, as printed"
  used_in: ["s18"]
  note: "The typo is in the last term under the square root: 4K_2(V_2/V_2 - 1)(V_1/V_2), where V_1/V_2 is required. Visible at this width; it was not at the column width. Confirmed by rendering p. 6841 at 200 dpi and by deriving the quadratic independently from Eq. 8 -- the leading coefficient is (u - 1), so the bracket cannot be (V_2/V_2 - 1), which is zero."

gk1981_eq8_wide:
  figure: "Eq. 8"
  shows: "V_1/V_2 = W*(1 - W* + K_1) / [(1 - W*)(W* + K_2)], alone"
  used_in: ["s18"]
  note: "The line segment 2 derives, in the authors' setting. Show it AFTER the derivation, never before."

gk1981_eq9_wide:
  figure: "Eq. 9"
  shows: "W* = K_2/(K_1 + K_2), the V_1 = V_2 case"
  used_in: ["s18"]
  note: "The crossing point, exact. posb.protein.crossing_fraction is this line. Not currently placed in the deck -- figures/build/s18_response_crossing.png carries the same result with the curves attached."

bashor2008_fig4cd:
  figure: "Fig. 4, panels C and D"
  shows: "the delay circuit and the enhanced ultrasensitive switch, each as a circuit diagram beside its measured response"
  used_in: ["s18"]
  note: "Cropped so the time courses can be read. Panel D's SCHEMATIC here is the superseded one -- the erratum of 22 August 2008 reissued it; see bashor2008_fig4d_corrected. The measured curve is unaffected."

# --- Dueber, Yeh, Chak & Lim, Science 301:1904-1908 (2003) -----------------
# "Reprogramming control of an allosteric signaling switch through modular
# recombination"
#
# PROVENANCE, because it is unusual. The PDF is not in private/readings. This
# crop comes from Adam's own 2025 deck (Lecture 24, "Protein-Circuits-and-
# more", slide 28), where the image is a 2011 screen capture of the paper
# opened in a browser; the figure region crops out clean at 2294x438 and the
# browser chrome is gone. The page footer in that capture reads "1904 | 26
# SEPTEMBER 2003 | VOL 301 | SCIENCE", and the author list was read off
# reference 3 of the Dueber 2007 PDF we do hold -- NOT from memory. Replace
# with a crop from the real PDF if it ever lands in private/readings.
dueber2003_fig1:
  figure: "Fig. 1"
  shows: "A: N-WASP as a modular allosteric switch, OFF autoinhibited against ON activated, with Cdc42 binding GBD and PIP2 binding the B motif. B: the synthetic single-input switch, with a PDZ domain-ligand pair swapped in as a heterologous autoinhibitory module. C: its dose-response, K_act = 50 uM"
  used_in: ["s18"]
  note: "Three things at once, which is why it is worth a surface. (1) It is the CYCLE -- an allosteric switch shown as two states with the input displacing the autoinhibition, and 'allosteric' has 0 occurrences in decks s01-s17 while the syllabus promises allosteric switches. (2) Its own caption says the two inputs act synergistically so that 'N-WASP resembles an AND gate' -- a protein that is a logic gate, which reaches back to session 16. (3) It is the PARENT of dueber2007_fig2b: the 2007 switches are built on this same N-WASP output domain, so this is what the SH3 stacking modulates. Measured on the slide, both verified against the PDF 26 Oct and in NUMBERS.md 2b: K_act = 50 uM (p. 1904), and the INPUT PEPTIDE's K_d = 8 uM (p. 1904, GVKESLV). Do not conflate that with the INTERNAL autoinhibitory ligand, which the authors also tighten to 8 uM on p. 1906 -- different ligand, same number."
