# --- Session 17 ------------------------------------------------------------
# The through-line: every one of these papers had to build an INSULATED
# MEASURING DEVICE before it could measure anything. Cambray brackets the
# terminator between two reporters and puts RNase sites around it to
# standardise the mRNA ends; Kosuri ratios sfGFP against an mCherry on the
# same plasmid; Mutalik defines an "expression operating unit" with named
# boundaries. The instrument has the same disease as the thing it measures.
# Show the devices, not just the results.

# --- Cambray, Guimaraes, Mutalik, Lam, Mai, Thimmaiah, Carothers, Arkin &
#     Endy, Nucleic Acids Research 41(9):5139-5148 (2013) -------------------
# "Measurement and modeling of intrinsic transcription terminators"
# doi:10.1093/nar/gkt163
