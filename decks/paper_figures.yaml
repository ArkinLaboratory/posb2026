# --- Mangan & Alon, PNAS 100:11980-11985 (2003) ----------------------------
# "Structure and function of the feed-forward loop network motif"
# doi:10.1073/pnas.2133841100  (open access)
# The eight structural types and their function/abundance are Tables 1 and 2.
# Handed out at session 9, discussed at session 10. Save the images (or crops
# of the 2025 L20 renderings, which reproduce these tables) to
# private/paper-figures/; the deck draws a labelled slot until then.
mangan2003_coherent_table:
  figure: "Table 1"
  shows: "the four coherent FFL types: structure, abundance in E. coli and S. cerevisiae, steady-state Z logic, and the sign-sensitive delay row for on/off Sx steps under AND and OR"
  used_in: ["s10"]
  note: >-
    Coherent type 1 (three activations) dominates: 28 in E. coli, 26 in yeast,
    against 2/5, 4/0, 1/0 for types 2-4. That abundance is the design principle
    -- of the four coherent wirings, the one that is a persistence detector on
    the ON step is the one nature keeps.

mangan2003_incoherent_table:
  figure: "Table 2"
  shows: "the four incoherent FFL types: structure, abundance, steady-state Z logic, the pulse row (Sy enable/destroy), and the response-acceleration row"
  used_in: ["s10"]
  note: >-
    Incoherent type 1 (X activates Y and Z, Y represses Z) dominates the
    incoherent set: 5 in E. coli, 21 in yeast. It is the pulse/accelerator, and
    it is Basu's circuit.

# --- Basu, Mehreja, Thiberge, Chen & Weiss, PNAS 101:6355-6360 (2004) -------
# "Spatiotemporal control of gene expression with pulse-generating networks"
# doi:10.1073/pnas.0307571101  (open access). Weiss is co-instructor of record
# in prior years, so this is a house paper.
# Handed out at session 9, discussed at session 10.
basu2004_fig1:
  figure: "Fig. 1"
  shows: "the sender/receiver pulse generator: LuxI makes AHL; in receivers LuxR-AHL activates both CI(LVA) and GFP(LVA), and CI represses the GFP promoter -- an incoherent type-1 FFL"
  used_in: ["s10"]
  note: >-
    This is the artifact the abstraction comes from. Point at the incoherence:
    the signal activates the output AND activates its own delayed repressor.

basu2004_fig3:
  figure: "Fig. 3"
  shows: "pulse response to different AHL concentrations (a) and to different rates of AHL increase (b, c) -- all reaching the same final level; slower rise gives a smaller, later pulse"
  used_in: ["s10"]
  note: >-
    Fig. 3b,c is the rate-sensing result and the reason the receivers detect
    distance. Our figures/build/s10_pulse_generator.png recomputes the same
    qualitative behaviour from posb; show them side by side.

