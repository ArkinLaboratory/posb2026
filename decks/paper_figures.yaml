fong2004_fig1b_lac_mal:
  figure: "Fig. 1b, lactate and malate panels"
  shows: "evolution time courses on lactate and on malate -- growth rate against DAY of evolution, one curve per deletion strain plus wild type. Two adjacent panels of their own figure, uncropped and unrearranged."
