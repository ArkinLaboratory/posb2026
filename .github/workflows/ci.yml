name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Install the version FLOOR, not the latest. The binding constraint is
      # whichever student environment is oldest (currently Colab), so testing
      # against the newest libraries would tell us nothing useful.
      - name: Install minimum supported dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "numpy==2.0.*" "scipy==1.16.*" "matplotlib==3.10.*" "sympy==1.14.*"
          pip install nbformat nbclient nbconvert pytest ipykernel
          pip install PyYAML
      - name: Schedule agrees with the course map
        run: python tools/check_schedule.py

      - name: Readings are assigned before they are discussed
        run: python tools/build_readings.py --check
      - name: Report resolved versions
        run: python -c "import numpy,scipy,matplotlib,sympy;print('numpy',numpy.__version__);print('scipy',scipy.__version__);print('matplotlib',matplotlib.__version__);print('sympy',sympy.__version__)"

      - name: Unit tests
        run: python -m pytest tests/ -q

      - name: Notebooks match their source modules
        run: python tools/build_notebooks.py --check

      - name: Execute every notebook
        run: python tools/execute_notebooks.py
